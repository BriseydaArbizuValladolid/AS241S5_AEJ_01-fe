name: Frontend Code Quality

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch: # Permite ejecutarlo manualmente

jobs:
  frontend-verification:
    name: Run Linter and Build Check
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del frontend
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # 3. Instalar las dependencias de forma limpia
      - name: Install Dependencies
        run: npm ci

      # 4. REVISAR CALIDAD: Ejecuta el linter (ESLint/Prettier) para buscar código desordenado
      - name: Run Linter (Quality Check)
        run: npx eslint@8 "src/**/*.{js,jsx,ts,tsx}" || echo "Linter finalizado u omitido por falta de configuración."

      # 5. SIMULAR COMPILACIÓN: Verifica que el proyecto sea capaz de compilarse sin errores
      - name: Test Production Build
        run: npm run build