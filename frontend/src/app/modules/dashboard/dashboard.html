<div class="dashboard-container">
  <div class="header-status">
    <div class="title-group">
      <h2>IA Dashboard <small>v2.0</small></h2>
    </div>
    <div *ngIf="cargando()" class="spinning material-icons">refresh</div>
  </div>

  <div class="actions-grid">
    <div class="action-card">
      <span class="material-icons main-icon">auto_fix_high</span>
      <h3>Anime</h3>
      <button class="btn-anime" (click)="procesarAnimacion()">Procesar URL</button>
    </div>
    <div class="action-card">
      <span class="material-icons main-icon">content_cut</span>
      <h3>Fondo</h3>
      <label class="btn-upload">Subir Archivo<input type="file" (change)="procesarFondo($event)" hidden/></label>
    </div>
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Original</th>
          <th>Resultado</th>
          <th>Servicio</th>
          <th>Estado</th>
          <th class="text-center">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of listado()">
          <td><div class="img-frame"><img [src]="limpiarUrl(item?.urlOriginal, item?.id || '')"></div></td>
          <td><div class="img-frame"><img [src]="limpiarUrl(item?.urlResultado, item?.id || '')"></div></td>

          <td><span class="tag">{{ item?.tipoServicio }}</span></td>

          <td>
            <span class="status-badge" [ngClass]="item?.activo !== false ? 'active' : 'inactive'">
              {{ item?.activo !== false ? 'Activo' : 'Inactivo' }}
            </span>
          </td>

          <td class="text-center">
            <div class="btn-group" *ngIf="item?.activo !== false">
              <button class="btn-icon edit" (click)="abrirModal(item)">
                <span class="material-icons">edit</span>
              </button>
              <button class="btn-icon delete" (click)="eliminar(item?.id || '')">
                <span class="material-icons">delete</span>
              </button>
            </div>

            <div *ngIf="item?.activo === false">
              <button class="btn-icon restore" (click)="restaurar(item?.id || '')">
                <span class="material-icons">settings_backup_restore</span>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="custom-overlay" *ngIf="mostrarModal && itemSeleccionado">
    <div class="custom-modal">
      <h3>Editar Registro</h3>
      <p class="id-label">ID: {{ itemSeleccionado.id }}</p>

      <div class="form-group">
        <label>Tipo de Servicio:</label>
        <select [(ngModel)]="itemSeleccionado.tipoServicio" class="full-select">
          <option value="BACKGROUND_REMOVER">BACKGROUND_REMOVER</option>
          <option value="PHOTO_TO_ANIME">PHOTO_TO_ANIME</option>
        </select>
      </div>

      <div class="modal-footer">
        <button class="btn-sec" (click)="cerrarModal()">Cancelar</button>
        <button class="btn-pri" (click)="guardarEdicion()">Confirmar Cambios</button>
      </div>
    </div>
  </div>
</div>
